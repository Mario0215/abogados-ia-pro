name: RAG Regression

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  rag-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run RAG regression against BASE_URL
        env:
          BASE_URL: ${{ secrets.RAG_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm run test:rag:regression
